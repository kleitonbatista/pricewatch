services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: pricewatch-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - pricewatch-network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: pricewatch-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pricewatch-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: pricewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricewatch
      POSTGRES_USER: pricewatch_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pricewatch-network

  redis:
    image: redis:7-alpine
    container_name: pricewatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pricewatch-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: pricewatch-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Porta SMTP usada pelo Laravel
      - "8025:8025" # Interface Web para ler os e-mails
    networks:
      - pricewatch-network

networks:
  pricewatch-network:
    driver: bridge

volumes:
  postgres_data: